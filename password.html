<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800&display=swap">
<link rel="stylesheet" href="style.css">
<title>שינוי סיסמה</title></head>
<body>
<header class="top"><a class="brand" href="index.html">חנות אפליקציות</a><nav><a href="index.html">חזרה לאתר</a></nav></header>
<main><section style="max-width:520px">
<h2>שינוי סיסמה</h2>
<form id="f" class="box">
  <label>סיסמה נוכחית<input id="old" type="password" required autocomplete="current-password"></label>
  <label>סיסמה חדשה (לפחות 8 תווים)<input id="new1" type="password" minlength="8" required autocomplete="new-password"></label>
  <label>אימות סיסמה חדשה<input id="new2" type="password" minlength="8" required autocomplete="new-password"></label>
  <p><button class="btn" type="submit">שמירה</button></p>
  <p id="msg" role="alert"></p>
</form></section></main>
<script src="auth.js"></script>
<script>
const s = getSession();
if (!s) location.replace("account.html");
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const msg = document.getElementById("msg");
  msg.className = "err"; msg.textContent = "";
  const n1 = document.getElementById("new1").value;
  if (n1 !== document.getElementById("new2").value) { msg.textContent = "הסיסמאות החדשות לא זהות"; return; }
  try {
    await api("/change-password", { oldPassword: document.getElementById("old").value, newPassword: n1 }, s.token);
    msg.className = ""; msg.textContent = "הסיסמה שונתה בהצלחה.";
    ev.target.reset();
  } catch (e) { msg.textContent = e.message; }
});
</script></body></html>
