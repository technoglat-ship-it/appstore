<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800&display=swap">
<link rel="stylesheet" href="style.css">
<title>התחברות והרשמה</title></head>
<body>
<header class="top"><a class="brand" href="index.html">חנות אפליקציות</a><nav><a href="index.html">חזרה לאתר</a></nav></header>
<main><section style="max-width:520px">
<h2>התחברות / הרשמה</h2>
<form id="f" class="box">
  <label>אימייל<input id="em" type="email" required autocomplete="email"></label>
  <label>סיסמה (לפחות 8 תווים)<input id="pw" type="password" minlength="8" required autocomplete="current-password"></label>
  <details><summary>קוד מנהל (למנהל בלבד)</summary><input id="code" type="password" autocomplete="off"></details>
  <p><button class="btn" type="submit" data-mode="login">התחברות</button>
  <button class="btn ghost" type="submit" data-mode="register">הרשמה</button></p>
  <p id="msg" class="err" role="alert"></p>
</form></section></main>
<script src="auth.js"></script>
<script>
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const mode = ev.submitter ? ev.submitter.dataset.mode : "login";
  const msg = document.getElementById("msg");
  msg.textContent = "";
  try {
    const j = await api("/" + mode, {
      email: document.getElementById("em").value,
      password: document.getElementById("pw").value,
      code: document.getElementById("code").value
    });
    localStorage.setItem(TOKEN_KEY, j.token);
    location.href = "index.html";
  } catch (e) { msg.textContent = e.message; }
});
</script></body></html>
